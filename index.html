function scale(){let t=CONFIG.companies[$('company').value]?.inspectionTypes[$('type').value];let raw=t?.scale||'SI/NO/NA'; if(raw.includes('+')) raw=raw.replaceAll('+','/'); return raw.split('/').map(x=>x.trim()).filter(Boolean)}
function isEpp(){return ($('type').value||'').toLowerCase().includes('epp')}
function setupEppSignature(){const show=isEpp();$('eppCollaboratorField').classList.toggle('hidden',!show);$('eppSignatureField').classList.toggle('hidden',!show);if(!show)return;const c=$('eppSignature'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let drawing=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#111';ctx.stroke();last=q};c.onpointerup=()=>{drawing=false;state.eppSignature=c.toDataURL('image/png')};c.onpointercancel=()=>{drawing=false};$('clearEppSignature').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);state.eppSignature=''}}
function renderChecklist(){let c=$('company').value,t=$('type').value;if(!c||!t)return;let typ=CONFIG.companies[c].inspectionTypes[t];$('formTitle').textContent=t;$('sourceInfo').textContent='Fuente: '+typ.sourceForm+' · '+typ.code+' · Escala: '+typ.scale;let items=getItems();let html='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+items.length+' ítems · N/A no afecta el porcentaje.</div>';items.forEach((it,i)=>{let key=it.code+'_'+i;html+=`<div class="item" data-key="${key}"><div class="itemtop"><div class="code">${it.code}</div><div><div style="font-weight:650">${esc(it.text)}</div>${it.meta?'<div style="font-size:11px;color:var(--muted);margin-top:3px">'+esc(JSON.stringify(it.meta).replace(/[{}\"]/g,' '))+'</div>':''}</div><div class="choices">${scale().map(v=>`<button type="button" class="choice" data-v="${esc(v)}" onclick="setResp('${key}','${esc(v)}')">${esc(v)}</button>`).join('')}</div></div><div class="obs"><textarea placeholder="Observación del ítem" oninput="setObs('${key}',this.value)"></textarea></div><div class="toolbar"><label class="btn secondary small" style="cursor:pointer">📷 Tomar evidencia<input type="file" accept="image/*" capture="environment" hidden onchange="addPhoto('${key}',this)"></label><label class="btn secondary small" style="cursor:pointer">🖼️ Galería<input type="file" accept="image/*" multiple hidden onchange="addPhoto('${key}',this)"></label><button type="button" class="btn danger small" onclick="openFinding('${key}')">${state.findings[key]?'Editar hallazgo':'Crear hallazgo'}</button></div><div id="photos_${key}"></div><div id="finding_${key}"></div></div>`});$('checklist').innerHTML=html;$('formTitle').scrollIntoView({behavior:'smooth',block:'start'});$('compliance').textContent='0%'}
function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function setResp(k,v){state.responses[k]=v;document.querySelectorAll(`[data-key="${k}"] .choice`).forEach(b=>b.classList.toggle('active',b.dataset.v===v));calc()}
function setObs(k,v){state.responses[k+'_obs']=v}
function calc(){let items=getItems(), weighted=items.some(it=>typeof it.weight==='number');let pct=0;if(weighted){let den=0,num=0;items.forEach((it,i)=>{let v=state.responses[it.code+'_'+i];if(v&&v!=='NA'&&v!=='N/A'){let w=Number(it.weight||0);den+=w;if(['C','SI','Sí','BUENO','B'].includes(v))num+=w}});pct=den?Math.round(num/den*100):0}else{let vals=items.map((it,i)=>state.responses[it.code+'_'+i]).filter(v=>v&&v!=='NA'&&v!=='N/A');let yes=vals.filter(v=>['C','SI','Sí','BUENO','B'].includes(v)).length;pct=vals.length?Math.round(yes/vals.length*100):0}$('compliance').textContent=pct+'%';$('compliance').className='status '+(pct>=86?'ok':pct<60&&((weighted&&items.length)||(!weighted&&items.length))?'bad':'')}
function addPhoto(k,input){Array.from(input.files||[]).forEach(f=>{if(!f.type.startsWith('image/'))return;let r=new FileReader();r.onload=()=>{state.photos[k]=state.photos[k]||[];state.photos[k].push(r.result);renderPhotos(k)};r.readAsDataURL(f)});input.value=''}
function renderPhotos(k){let el=$('photos_'+k);if(!el)return;el.innerHTML=(state.photos[k]||[]).map((p,i)=>`<span class="photo"><img class="thumb" src="${p}"><button class="btn danger small" onclick="state.photos['${k}'].splice(${i},1);renderPhotos('${k}')">×</button></span>`).join('')}
function openFinding(k){let old=state.findings[k]||{};let d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:10;padding:20px';d.innerHTML=`<div class="card" style="max-width:650px;width:100%;max-height:90vh;overflow:auto"><h2>Hallazgo</h2><div class="field"><label>Descripción</label><textarea id="fd">${esc(old.description||'')}</textarea></div><div class="field"><label>Acción correctiva</label><textarea id="fa">${esc(old.action||'')}</textarea></div><div class="row"><div class="field"><label>Responsable</label><input id="fr" value="${esc(old.responsible||'')}"></div><div class="field"><label>Fecha límite</label><input id="fdue" type="date" value="${esc(old.due||'')}"></div></div><div class="field"><label>Evidencia de cierre</label><div class="toolbar"><label class="btn secondary small" style="cursor:pointer">📷 Tomar foto<input id="fcam" type="file" accept="image/*" capture="environment" hidden></label><label class="btn secondary small" style="cursor:pointer">🖼️ Galería<input id="fgal" type="file" accept="image/*" hidden></label></div><div id="closurePreview" style="margin-top:8px">${old.closurePhoto?`<img class="thumb" src="${old.closurePhoto}">`:''}</div></div><div class="toolbar"><button class="btn ok" onclick="saveFinding('${k}')">Guardar</button><button class="btn secondary" onclick="this.closest('[style*=fixed]').remove()">Cancelar</button></div></div>`;document.body.appendChild(d);['fcam','fgal'].forEach(id=>$(id).addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{d.dataset.closure=r.result;$('closurePreview').innerHTML=`<img class="thumb" src="${r.result}">`};r.readAsDataURL(f)}))} 

function saveFinding(k){let old=state.findings[k]||{},modal=document.querySelector('[style*=fixed]');state.findings[k]={description:$('fd').value,action:$('fa').value,responsible:$('fr').value,due:$('fdue').value,closed:!!old.closed,closurePhoto:modal?.dataset.closure||old.closurePhoto||null};modal?.remove();let e=$('finding_'+k);e.innerHTML='<div class="finding"><b>Hallazgo registrado:</b> '+esc(state.findings[k].description)+(state.findings[k].closed?' · <b>CERRADO</b>':'')+(state.findings[k].closurePhoto?' · 📷 Evidencia de cierre':'')+'</div>'}

function record(){let items=getItems();return {id:'MOMA-'+Date.now(),company:$('company').value,type:$('type').value,morangoPlace:$('morangoPlace').value,masaPoint:$('masaPoint').value,area:$('area').value,location:$('location').value,inspector:$('inspector').value,responsible:$('responsible').value,date:$('date').value,eppCollaborator:isEpp()?$('eppCollaborator').value.trim():'',eppSignature:isEpp()?state.eppSignature:'',generalObs:$('generalObs').value,approval:{status:'Pendiente',requestedAt:'',email:$('copasstEmail').value,approvedBy:'',approvedAt:'',comment:''},responses:JSON.parse(JSON.stringify(state.responses)),findings:JSON.parse(JSON.stringify(state.findings)),photos:JSON.parse(JSON.stringify(state.photos)),source:CONFIG.companies[$('company').value].inspectionTypes[$('type').value].sourceForm,code:CONFIG.companies[$('company').value].inspectionTypes[$('type').value].code,items:JSON.parse(JSON.stringify(items)),scale:scale(),created:new Date().toISOString()}}
$('save').onclick=()=>{if(!$('company').value||!$('type').value||!$('area').value.trim()||!$('location').value.trim()||!$('inspector').value||!$('date').value||( $('company').value==='Morango S.A.S.' && !$('morangoPlace').value )||( $('company').value==='Somos Masa S.A.S.' && !$('masaPoint').value.trim() )||(isEpp() && (!$('eppCollaborator').value.trim()||!state.eppSignature))){alert(isEpp()&&!$('eppCollaborator').value.trim()?'Ingresa el nombre del colaborador inspeccionado.':isEpp()&&!state.eppSignature?'Registra la firma digital del colaborador inspeccionado.':'Completa los datos obligatorios de la inspección, incluyendo área, ubicación y la información específica de la empresa.');return}localStorage.setItem('moma_copasst_email',$('copasstEmail').value.trim());let r=record();state.history.unshift(r);localStorage.setItem('moma_history',JSON.stringify(state.history));alert('Inspección guardada: '+r.id);renderHistory()}
$('clear').onclick=()=>{location.reload()};
function renderHistory(){let h=state.history;$('panel').classList.remove('hidden');$('panel').innerHTML='<h2>Historial</h2><table class="table"><tr><th>ID</th><th>Razón social</th><th>Tipo</th><th>Fecha</th><th>Resultado</th><th>Aprobación COPASST</th><th></th></tr>'+h.map(r=>`<tr><td>${r.id}</td><td>${esc(r.company)}</td><td>${esc(r.type)}</td><td>${r.date}</td><td>${score(r)}%</td><td>${approvalBadge(r)}</td><td><div class="toolbar"><button class="btn small" onclick="printReport('${r.id}')">Informe PDF</button><button class="btn secondary small" onclick="requestApproval('${r.id}')">✉️ Solicitar</button><button class="btn ok small" onclick="approveInspection('${r.id}')">✓ Registrar aprobación</button></div></td></tr>`).join('')+'</table>'} 
function approvalBadge(r){let a=r.approval||{};return `<span class="status ${a.status==='Aprobado'?'ok':''}">${esc(a.status||'Sin solicitar')}</span>${a.approvedBy?`<div style="font-size:11px;margin-top:4px">${esc(a.approvedBy)} · ${esc(a.approvedAt||'')}</div>`:''}`}
function requestApproval(id){let r=state.history.find(x=>x.id===id);if(!r)return;let email=(r.approval&&r.approval.email)||$('copasstEmail').value.trim()||localStorage.getItem('moma_copasst_email')||prompt('Correo del COPASST:','');if(!email)return;r.approval=r.approval||{};r.approval.email=email;r.approval.status='Pendiente';r.approval.requestedAt=new Date().toISOString();localStorage.setItem('moma_copasst_email',email);localStorage.setItem('moma_history',JSON.stringify(state.history));let subject=encodeURIComponent(`Solicitud de aprobación COPASST - ${r.id}`);let body=encodeURIComponent(`Solicitud de aprobación de inspección SST\n\nID: ${r.id}\nRazón social: ${r.company}\nTipo: ${r.type}\nLugar: ${r.morangoPlace||'—'}\nPunto de Masa: ${r.masaPoint||'—'}\nÁrea: ${r.area||'—'}\nUbicación: ${r.location||'—'}\nFecha: ${r.date}\nResultado: ${score(r)}%\n\nPor favor revisar el informe adjunto y confirmar la aprobación del documento.`);window.location.href=`mailto:${email}?subject=${subject}&body=${body}`;renderHistory()}
function approveInspection(id){let r=state.history.find(x=>x.id===id);if(!r)return;let who=prompt('Nombre de quien aprueba en COPASST:',r.approval?.approvedBy||'');if(!who)return;let comment=prompt('Comentario de aprobación (opcional):',r.approval?.comment||'')||'';r.approval=r.approval||{};r.approval.status='Aprobado';r.approval.approvedBy=who;r.approval.approvedAt=new Date().toISOString();r.approval.comment=comment;localStorage.setItem('moma_history',JSON.stringify(state.history));renderHistory()}

function score(r){if(r.items.some(it=>typeof it.weight==='number')){let den=0,num=0;r.items.forEach((it,i)=>{let v=r.responses[it.code+'_'+i];if(v&&v!=='NA'&&v!=='N/A'){let w=Number(it.weight||0);den+=w;if(['C','SI','Sí','BUENO','B'].includes(v))num+=w}});return den?Math.round(num/den*100):0}let vals=r.items.map((it,i)=>r.responses[it.code+'_'+i]).filter(v=>v&&v!=='NA'&&v!=='N/A');let yes=vals.filter(v=>['C','SI','Sí','BUENO','B'].includes(v)).length;return vals.length?Math.round(yes/vals.length*100):0}
$('historyBtn').onclick=renderHistory;$('dashBtn').onclick=()=>{let h=state.history;let by={};h.forEach(r=>{by[r.company]=(by[r.company]||[]);by[r.company].push(r)});$('panel').classList.remove('hidden');$('panel').innerHTML='<h2>Indicadores</h2><div class="metricgrid"><div class="metric"><span>Inspecciones</span><strong>'+h.length+'</strong></div><div class="metric"><span>Hallazgos</span><strong>'+h.reduce((n,r)=>n+Object.keys(r.findings||{}).length,0)+'</strong></div><div class="metric"><span>Cerrados</span><strong>'+h.reduce((n,r)=>n+Object.values(r.findings||{}).filter(x=>x.closed).length,0)+'</strong></div><div class="metric"><span>Promedio</span><strong>'+ (h.length?Math.round(h.reduce((n,r)=>n+score(r),0)/h.length):0)+'%</strong></div></div><h3 style="margin-top:20px">Por razón social</h3>'+Object.entries(by).map(([c,rs])=>'<p><b>'+esc(c)+'</b>: '+rs.length+' inspecciones · promedio '+Math.round(rs.reduce((n,r)=>n+score(r),0)/rs.length)+'%</p>').join('')};
function printReport(id){let r=state.history.find(x=>x.id===id);if(!r)return;let rows=r.items.map((it,i)=>{let k=it.code+'_'+i,v=r.responses[k]||'—',o=r.responses[k+'_obs']||'',ph=(r.photos[k]||[]).map(p=>`<img class="thumb" src="${p}">`).join(' '),f=r.findings[k];return `<tr><td>${esc(it.code)}</td><td>${esc(it.text)}</td><td><b>${esc(v)}</b></td><td>${esc(o)}${f?'<br><b>Hallazgo:</b> '+esc(f.description)+'<br><b>Acción:</b> '+esc(f.action)+'<br><b>Responsable:</b> '+esc(f.responsible)+'<br><b>Fecha límite:</b> '+esc(f.due)+(f.closed?' <b>· CERRADO</b>':'')+(f.closurePhoto?'<br><b>Cierre:</b> <img class="thumb" src="'+f.closurePhoto+'">':''):''}</td><td>${ph}</td></tr>`}).join('');let w=window.open('','_blank');w.document.write(`<html><head><title>${r.id}</title><style>body{font-family:Arial;padding:28px;color:#111}h1{margin-bottom:2px}table{border-collapse:collapse;width:100%;font-size:11px}th,td{border:1px solid #ccc;padding:6px;vertical-align:top}th{background:#eee}.thumb{width:90px;height:65px;object-fit:cover;margin:2px}.box{border:1px solid #ccc;padding:10px;margin:8px 0}</style></head><body><h1>MOMA SST</h1><h2>Informe de inspección</h2><div class="box"><b>Razón social:</b> ${esc(r.company)}<br><b>Tipo:</b> ${esc(r.type)}<br><b>Lugar:</b> ${esc(r.morangoPlace||'—')}<br><b>Punto de Masa:</b> ${esc(r.masaPoint||'—')}<br><b>Área:</b> ${esc(r.area)}<br><b>Ubicación:</b> ${esc(r.location)}<br><b>Inspector:</b> ${esc(r.inspector)}<br><b>Responsable:</b> ${esc(r.responsible)}<br><b>Fecha:</b> ${r.date}<br>${r.type.toLowerCase().includes('epp')?`<b>Colaborador inspeccionado:</b> ${esc(r.eppCollaborator||'—')}<br>`:''}<b>Fuente:</b> ${esc(r.source)} · ${esc(r.code)}<br><b>Resultado:</b> ${score(r)}%<br><b>COPASST:</b> ${esc(r.approval?.status||'Sin solicitar')} ${r.approval?.approvedBy?`· ${esc(r.approval.approvedBy)} · ${esc(r.approval.approvedAt||'')}`:''}${r.approval?.comment?`<br><b>Comentario COPASST:</b> ${esc(r.approval.comment)}`:''}</div><div class="box"><b>Observaciones generales:</b><br>${esc(r.generalObs)}</div><table><tr><th>Código</th><th>Ítem</th><th>Resultado</th><th>Observación / hallazgo</th><th>Evidencia</th></tr>${rows}</table><br><div class="box"><b>Firma inspector:</b><br><br>____________________________</div>${r.type.toLowerCase().includes('epp')&&r.eppSignature?`<div class="box"><b>Firma digital del colaborador inspeccionado:</b><br><img src="${r.eppSignature}" style="width:350px;height:90px;object-fit:contain;border-bottom:1px solid #111"></div>`:''}<div class="box"><b>Firma responsable:</b><br><br>____________________________</div><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`);w.document.close()}
</script></body></html>
